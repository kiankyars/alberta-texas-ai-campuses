<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-label="Concept engineering drawing"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#dce3dc" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#526c70"/></marker></defs><rect width="100%" height="100%" fill="#eff2ec"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#172e3c"><text x="35" y="35" font-size="14" >TEXAS, UNITED STATES / THERMAL &amp; WATER CONCEPT</text><text x="35" y="58" font-size="11" >Separate direct-liquid and residual-air paths • water-equivalent circulation calculations</text><rect x="35" y="150" width="190" height="92" fill="#d4e0d7" stroke="#65817e" /><text x="130" y="173" font-size="13" text-anchor="middle">100 MW IT heat</text><text x="130" y="192" font-size="11" text-anchor="middle">90 MW to liquid</text><text x="130" y="211" font-size="11" text-anchor="middle">10 MW to air</text><line x1="225" y1="178" x2="270" y2="178" stroke="#526c70" stroke-width="1.5" /><line x1="270" y1="178" x2="270" y2="126" stroke="#526c70" stroke-width="1.5" /><line x1="270" y1="126" x2="340" y2="126" stroke="#526c70" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="83" width="285" height="85" fill="#d4e0d7" stroke="#65817e" /><text x="482.5" y="106" font-size="13" text-anchor="middle">CDUs / 90 MW liquid duty</text><text x="482.5" y="125" font-size="11" text-anchor="middle">7,763 m³/h recirculation</text><text x="482.5" y="144" font-size="11" text-anchor="middle">35/45°C facility target; OEM check</text><line x1="225" y1="216" x2="270" y2="216" stroke="#526c70" stroke-width="1.5" /><line x1="270" y1="216" x2="270" y2="273" stroke="#526c70" stroke-width="1.5" /><line x1="270" y1="273" x2="340" y2="273" stroke="#526c70" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="236" width="285" height="70" fill="#d4e0d7" stroke="#65817e" /><text x="482.5" y="259" font-size="13" text-anchor="middle">10 MW residual room-air heat</text><text x="482.5" y="278" font-size="11" text-anchor="middle">Air handlers / sensible cooling</text><line x1="625" y1="126" x2="680" y2="126" stroke="#526c70" stroke-width="1.5" /><line x1="680" y1="126" x2="680" y2="196" stroke="#526c70" stroke-width="1.5" /><line x1="625" y1="273" x2="680" y2="273" stroke="#526c70" stroke-width="1.5" /><line x1="680" y1="273" x2="680" y2="196" stroke="#526c70" stroke-width="1.5" /><line x1="680" y1="196" x2="735" y2="196" stroke="#526c70" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="735" y="145" width="230" height="104" fill="#d4e0d7" stroke="#65817e" /><text x="850" y="168" font-size="13" text-anchor="middle">Dry rejection + trim</text><text x="850" y="187" font-size="11" text-anchor="middle">140 MW campus peak</text><text x="850" y="206" font-size="11" text-anchor="middle">Includes non-IT overhead</text><text x="850" y="225" font-size="11" text-anchor="middle">Local peak derating required</text><line x1="850" y1="249" x2="850" y2="335" stroke="#526c70" stroke-width="1.5" /><line x1="485" y1="335" x2="850" y2="335" stroke="#526c70" stroke-width="1.5" /><line x1="485" y1="335" x2="485" y2="306" stroke="#526c70" stroke-width="1.5" marker-end="url(#arrow)"/><text x="632" y="326" font-size="10" >Closed-loop return</text><rect x="35" y="395" width="285" height="113" fill="#d4e0d7" stroke="#65817e" /><text x="177.5" y="418" font-size="13" text-anchor="middle">Per-phase rejection</text><text x="177.5" y="437" font-size="11" text-anchor="middle">7 duty + 1 reserve</text><text x="177.5" y="456" font-size="11" text-anchor="middle">5 MW net per module</text><text x="177.5" y="475" font-size="11" text-anchor="middle">32 modules installed</text><rect x="357" y="395" width="285" height="113" fill="#d4e0d7" stroke="#65817e" /><text x="499.5" y="418" font-size="13" text-anchor="middle">Water make-up: unquantified</text><text x="499.5" y="437" font-size="11" text-anchor="middle">No cooling-tower design assumption</text><text x="499.5" y="456" font-size="11" text-anchor="middle">Potable, process, leakage, trim and</text><text x="499.5" y="475" font-size="11" text-anchor="middle">firewater verified separately</text><rect x="677" y="395" width="288" height="113" fill="#d4e0d7" stroke="#65817e" /><text x="821" y="418" font-size="13" text-anchor="middle">Texas design conditions</text><text x="821" y="437" font-size="11" text-anchor="middle">Dry coolers require hot-weather trim</text><text x="821" y="456" font-size="11" text-anchor="middle">Dust/fouling and ambient derating</text><text x="821" y="475" font-size="11" text-anchor="middle">Load/ambient energy model needed</text><text x="35" y="554" font-size="11" >Q = mass flow × cp × ΔT; cp 4.186 kJ/(kg·K), ΔT 10 K, density 997 kg/m³. Circulation is not water consumption.</text><text x="35" y="578" font-size="11" >Return paths shown schematically. Isolation valves, pump redundancy, CDU approach and thermal buffers require detailed design.</text></g></svg>