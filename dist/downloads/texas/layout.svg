 >4 × 21,600 m² = 86,400 m²</text><text x="575" y="170" font-size="10" letter-spacing="1">BUILDING COVERAGE</text><text x="575" y="193" font-size="12" >18% of 48 ha campus envelope</text><text x="575" y="228" font-size="10" letter-spacing="1">LAYOUT STATUS</text><text x="575" y="251" font-size="12" >Test-fit, not a cadastral overlay</text><text x="575" y="286" font-size="10" letter-spacing="1">LAND CONTROL</text><text x="575" y="309" font-size="12" >No option, survey or access right</text><text x="575" y="344" font-size="10" letter-spacing="1">SITE VALIDATION</text><text x="575" y="367" font-size="12" >Title / easements / water / flood / geotech</text><text x="575" y="402" font-size="10" letter-spacing="1">POWER COMPOUND</text><text x="575" y="425" font-size="12" >Emergency diesel within campus yard</text><text x="575" y="460" font-size="10" letter-spacing="1">DESIGN GATE</text><text x="575" y="483" font-size="12" >11.5 ha gross outside campus envelope</text><text x="35" y="542" font-size="11" >48 ha concept is illustrative. The historical 147-acre tract availability and usable boundary remain unconfirmed.</text><text x="35" y="565" font-size="11" >Internal roads, fire access and stormwater must be reconciled to civil engineering. Rectangles are conceptual allocations.</text></g></svg>